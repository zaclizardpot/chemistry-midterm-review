<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b11">
  <meta name="description" content="化學原理第一次期中考互動複習題卡">
  <title>化原期中互動複習題卡</title>
  <link rel="stylesheet" href="style.css?v=20261022-rich1">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">GENERAL CHEMISTRY MIDTERM REVIEW</p>
        <h1>化原期中互動複習題卡</h1>
        <p id="bank-description" class="subtitle">考古題保留原題幹、選項與順序；詳解與核對結果以中文呈現。</p>
      </div>
      <div class="hero-actions">
        <a class="button ghost compact button-link" href="notes.html">筆記</a>
        <button id="account-button" class="button ghost compact" type="button">帳號／同步</button>
      </div>
    </header>

    <nav class="bank-tabs" aria-label="選擇題庫">
      <button class="bank-tab active" data-bank="exam" type="button">
        <span>考古原題</span><strong id="exam-count">—</strong>
      </button>
      <button class="bank-tab" data-bank="practice" type="button">
        <span>統整練習</span><strong id="practice-count">—</strong>
      </button>
    </nav>

    <section class="dashboard" aria-label="學習進度">
      <div><strong id="stat-seen">0</strong><span>已作答</span></div>
      <div><strong id="stat-correct">0</strong><span>答對</span></div>
      <div><strong id="stat-starred">0</strong><span>星號</span></div>
      <div><strong id="stat-missed">0</strong><span>答錯次數</span></div>
    </section>

    <section class="toolbar">
      <button id="history-button" class="button ghost" type="button">題目總覽與紀錄</button>
      <button id="star-practice-button" class="button ghost" type="button">★ 星號題目練習 <span id="star-count">(0)</span></button>
      <button id="refresh-button" class="button ghost" type="button">刷新本輪題目</button>
    </section>

    <div class="progress-track" aria-hidden="true"><div id="progress-bar"></div></div>
    <p id="mode-banner" class="mode-banner hidden"></p>

    <section id="question-card" class="question-card" aria-live="polite">
      <div class="loading">正在載入題庫…</div>
    </section>

    <p class="save-note"><span id="sync-dot" class="sync-dot"></span><span id="sync-status">進度會先儲存在這台裝置</span></p>
  </main>

  <dialog id="history-dialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <div><p class="eyebrow">QUESTION OVERVIEW</p><h2>題目總覽與作答紀錄</h2></div>
      <button class="icon-button" aria-label="關閉" value="close">×</button>
    </form>
    <div class="history-controls">
      <input id="history-search" type="search" placeholder="搜尋題目、出處、章節或主題">
      <select id="history-filter" aria-label="篩選題目">
        <option value="all">全部</option>
        <option value="seen">已作答</option>
        <option value="unseen">未作答</option>
        <option value="starred">有星號</option>
        <option value="missed">曾答錯</option>
        <option value="incomplete">來源不完整</option>
      </select>
    </div>
    <div id="history-list" class="history-list"></div>
  </dialog>

  <dialog id="account-dialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <div><p class="eyebrow">CLOUD SYNC</p><h2>帳號與跨裝置同步</h2></div>
      <button class="icon-button" aria-label="關閉" value="close">×</button>
    </form>
    <div id="account-signed-out">
      <p class="dialog-copy">不登入也能使用，進度會保存在目前瀏覽器。日後設定 Supabase 後，可用電子郵件與密碼在手機、電腦同步。</p>
      <label>電子郵件<input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label>密碼<input id="auth-password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 個字元"></label>
      <div class="dialog-actions">
        <button id="sign-in-button" class="button primary" type="button">登入</button>
        <button id="sign-up-button" class="button ghost" type="button">建立帳號</button>
      </div>
    </div>
    <div id="account-signed-in" class="hidden">
      <p>目前帳號：<strong id="account-email"></strong></p>
      <p class="dialog-copy">每次作答、加星號或切換題庫後都會自動同步。</p>
      <button id="sign-out-button" class="button ghost" type="button">登出</button>
    </div>
    <p id="auth-message" class="auth-message"></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js?v=20261022-rich1"></script>
</body>
</html>
